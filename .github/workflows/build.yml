name: CI Android Build

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # ДОБАВЛЕНО: Установка Java 17, необходимой для сборки Android APK
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            python3-pip \
            build-essential \
            libffi-dev \
            libssl-dev \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libstdc++6 \
            libbz2-dev \
            libreadline-dev \
            libsqlite3-dev \
            llvm \
            libxml2-dev \
            libxmlsec1-dev \
            liblzma-dev

    # ДОБАВЛЕНО: Обновление базовых утилит и установка Buildozer
    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip setuptools virtualenv
        pip install Cython buildozer

    - name: Build with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package-apk
        path: bin/*.apk